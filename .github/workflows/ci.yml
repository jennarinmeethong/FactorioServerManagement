name: Factorio Server Manager CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - id: version
        name: Resolve build version
        shell: bash
        run: |
          version="0.1.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: dotnet test FactorioServerManager.sln -p:Version=${{ steps.version.outputs.value }}
      - run: bun install --frozen-lockfile
        working-directory: src/FactorioManager.Web
      - run: bun run build
        working-directory: src/FactorioManager.Web

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: version
        name: Resolve build version
        shell: bash
        run: |
          version="0.1.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            factorio-server-manager:${{ github.sha }}
            factorio-server-manager:${{ steps.version.outputs.value }}
