name: Factorio Server Manager CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: dotnet test FactorioServerManager.sln
      - run: bun install --frozen-lockfile
        working-directory: src/FactorioManager.Web
      - run: bun run build
        working-directory: src/FactorioManager.Web

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: factorio-server-manager:\${{ github.sha }}
